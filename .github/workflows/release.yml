name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v0.1.0
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          SOURCE_VERSION=$(PYTHONPATH=src python -c 'from personal_backlog import __version__; print(__version__)')
          if [ "$SOURCE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Source version $SOURCE_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --verify-tag --generate-notes --title "$RELEASE_TAG"
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
